name: linux

# Proves the portable half: the protocol, parsing and state-machine layers that carry the bulk of
# this project's tests. Every macOS-only file is wrapped in `#if os(macOS)` and compiles to an empty
# module here, so a green run says nothing about the app — that is what macos.yml is for.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    container: swift:6.1-noble
    steps:
      - uses: actions/checkout@v4

      # Keeps the purity gate first, then refuses the false-green state where platform guards make
      # any portable test target report zero tests before running the complete Linux suite.
      - name: Portable build and tests
        run: Scripts/test-linux.sh
