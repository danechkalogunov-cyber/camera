<meta name="shot-viewport" content="900x300">
<style>
  :root{ --bg:#0B0C0E; --surface:#15171A; --text:#F2F3F5; --dim:#8A9099; --accent:#4DA3FF; }
  body{margin:0;background:var(--bg);font:400 15px/1.45 "Inter Variable",Inter,system-ui;color:var(--text);
       display:grid;place-items:center;height:300px}
  .card{background:var(--surface);border:1px solid #FFFFFF14;border-radius:14px;padding:22px 26px;
        box-shadow:0 12px 32px #00000066, inset 0 1px 0 #FFFFFF14}
  h1{margin:0 0 6px;font:600 22px/1.2 "Inter Variable";letter-spacing:-.01em}
  p{margin:0;color:var(--dim);font-size:13px}
  code{font-family:"JetBrains Mono",monospace;color:var(--accent);font-size:12px}
</style>
<div class="card">
  <h1>Vigil — render harness</h1>
  <p>Inter + JetBrains Mono resolved · 2× DPI · <code>deviceScaleFactor: 2</code></p>
</div>
