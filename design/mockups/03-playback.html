<title>Vigil — playback</title>
<meta name="shot-viewport" content="1440x900">
<style>
  /* Built from docs/UX.md §7 (playback wireframe, timeline encoding, zoom stops, transport bar)
     and docs/DESIGN.md tokens. The heatmap is drawn on a canvas with a seeded PRNG so the picture
     is deterministic and reproduces exactly on every render.
     Substitutions: SF Pro -> Inter, SF Mono -> JetBrains Mono, SF Symbols -> inline SVG. */
  :root{
    --canvas:#0B0C0F; --sidebar:#101116; --surface:#16181D; --raised:#1D2026; --overlay:#252932;
    --text-1:#F2F4F8; --text-2:#A7AEBC; --text-3:#88909D; --text-dis:#4E5563;
    --accent:#7B61FF; --accent-fill:#6247E8; --focus:#9581FF;
    --live:#FF2E43; --ok:#32D74B; --warn:#FFD426; --motion:#FF9F0A; --continuous:#3B9CFF;
    --id1:#2FB8E8; --id4:#F5674A;
    --s-sub:rgba(255,255,255,.06); --s-def:rgba(255,255,255,.10); --s-str:rgba(255,255,255,.18);
    --s-vid:rgba(255,255,255,.14);
    --ui:"Inter Variable",Inter,system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#000;font-family:var(--ui);font-size:13px;line-height:18px;color:var(--text-1);
       -webkit-font-smoothing:antialiased}
  svg{display:block}
  .ic{width:15px;height:15px;stroke:currentColor;stroke-width:1.6;fill:none;
      stroke-linecap:round;stroke-linejoin:round}
  .ic.sm{width:12px;height:12px;stroke-width:1.8}
  .win{width:1440px;height:900px;display:grid;grid-template-rows:44px 1fr 48px 200px;
       background:var(--canvas);overflow:hidden}

  /* ── toolbar ── */
  .tb{display:flex;align-items:center;gap:10px;padding:0 14px;
      background:rgba(22,24,29,.72);backdrop-filter:blur(30px) saturate(1.7);
      border-bottom:1px solid var(--s-def)}
  .lights{display:flex;gap:8px;margin-right:6px}
  .lights i{width:12px;height:12px;border-radius:50%;display:block}
  .day{display:flex;align-items:center;gap:2px;height:28px;padding:0 4px;border-radius:8px;
       background:var(--raised);border:1px solid var(--s-def)}
  .day button{width:22px;height:22px;border:0;background:transparent;color:var(--text-2);
              border-radius:6px;display:grid;place-items:center}
  .day .d{font-family:var(--mono);font-size:12px;font-weight:500;padding:0 8px;color:var(--text-1)}
  .camchip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:8px;
           background:var(--raised);border:1px solid var(--s-def);font-size:12px;font-weight:500}
  .camchip i{width:6px;height:6px;border-radius:50%}
  .camchip.add{color:var(--text-3);border-style:dashed}
  .tbtn{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:8px;
        background:transparent;border:1px solid transparent;color:var(--text-2);font-size:13px}
  .tbtn.on{background:#161427;border-color:rgba(123,97,255,.4);color:var(--text-1)}
  .tbtn.bordered{border-color:var(--s-def);background:var(--raised)}
  kbd{font-family:var(--mono);font-size:10px;color:var(--text-3);background:rgba(255,255,255,.06);
      border:1px solid var(--s-sub);border-radius:4px;padding:1px 4px}
  .sp{flex:1}

  /* ── canvas ── */
  .stage{padding:8px;display:grid;grid-template-columns:1fr 1fr;gap:2px}
  .pane{position:relative;background:#000;border-radius:14px;overflow:hidden;
        border:1px solid var(--s-sub)}
  .pane.focus{border:2px solid var(--accent);
              box-shadow:0 0 0 1px rgba(149,129,255,.3),0 0 14px rgba(123,97,255,.24)}
  .scene{position:absolute;inset:0;overflow:hidden}
  .scene .sky{position:absolute;inset:0 0 44% 0;background:linear-gradient(180deg,#0A0C10,#151B23 70%,#1C2028)}
  .scene .ground{position:absolute;left:-20%;right:-20%;bottom:-10%;height:60%;
    background:linear-gradient(180deg,#0D0E11,#1B1813 38%,#2C2519 74%,#352C1E)}
  .scene .pool{position:absolute;left:50%;bottom:-16%;width:74%;height:54%;transform:translateX(-50%);
    background:radial-gradient(50% 50% at 50% 50%,rgba(255,206,140,.30),rgba(255,196,120,.06) 56%,transparent 78%)}
  .scene .wallL{position:absolute;left:0;top:8%;width:24%;bottom:34%;
    background:linear-gradient(90deg,#23262C,#181B20 70%,#121418);clip-path:polygon(0 0,100% 16%,100% 84%,0 100%)}
  .scene .wallR{position:absolute;right:0;top:6%;width:20%;bottom:30%;
    background:linear-gradient(270deg,#1F2228,#16181D 70%,#111317);clip-path:polygon(100% 0,0 14%,0 86%,100% 100%)}
  .scene .door{position:absolute;left:37%;top:20%;width:26%;bottom:32%;border-radius:3px 3px 0 0;
    background:linear-gradient(180deg,#2C2722,#1E1B17);box-shadow:inset 0 0 0 1px rgba(255,255,255,.05)}
  .scene .vig{position:absolute;inset:0;
    background:radial-gradient(78% 68% at 50% 46%,transparent 42%,rgba(0,0,0,.62) 100%)}
  .grain{position:absolute;inset:0;opacity:.12;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3'/></filter><rect width='120' height='120' filter='url(%23n)'/></svg>")}
  .chrome-t{position:absolute;left:0;right:0;top:0;display:flex;gap:6px;padding:8px}
  .chip{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 7px;border-radius:6px;
        background:rgba(0,0,0,.62);border:1px solid var(--s-vid);font-size:11px;font-weight:600;color:#fff}
  .chip i{width:6px;height:6px;border-radius:50%}
  .osd{position:absolute;left:8px;bottom:8px;font-family:var(--mono);font-size:11px;font-weight:600;
       color:#fff;background:rgba(0,0,0,.62);border:1px solid var(--s-vid);border-radius:6px;
       padding:3px 8px}

             box-shadow:0 0 0 1px rgba(0,0,0,.5)}
  .motionbox span{position:absolute;top:-15px;left:-1px;font-family:var(--mono);font-size:9px;
                  font-weight:600;color:#0B0C0F;background:var(--motion);border-radius:3px;padding:0 3px}

  /* ── transport ── */

<script>
// Deterministic pseudo-random so the rendered picture is identical on every run.
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

// Heatmap encoding per docs/UX.md §7.3: one colour per pixel column, priority alarm > motion >
// continuous, opacity 0.55 + 0.45 * coverage, gaps are canvas with a dotted baseline.
const COL = {continuous:'59,156,255', motion:'255,159,10', alarm:'255,46,67'};

function paint(id, seed, alarms){
  const c = document.getElementById(id), g = c.getContext('2d');
  const W = c.width, H = c.height, rnd = mulberry32(seed);
  g.fillStyle = '#0B0C0F'; g.fillRect(0,0,W,H);

  // Build a per-column state for a two-hour window.
  const state = new Array(W).fill('continuous');
  // Gaps — the camera was not recording.
  let x = 0;
  while (x < W) {
    x += 140 + Math.floor(rnd()*420);
    const len = 40 + Math.floor(rnd()*150);
    for (let i = x; i < Math.min(W, x+len); i++) state[i] = 'none';
    x += len;
  }
  // Motion runs.
  x = 0;
  while (x < W) {
    x += 150 + Math.floor(rnd()*430);
    const len = 90 + Math.floor(rnd()*300);
    for (let i = x; i < Math.min(W, x+len); i++) if (state[i] !== 'none') state[i] = 'motion';
    x += len;
  }
  // Alarms — narrow, high priority, and never allowed to fall below the 2 pt minimum width.
  for (const a of alarms) {
    const s = Math.floor(a*W);
    for (let i = s; i < Math.min(W, s + 10); i++) state[i] = 'alarm';
  }

  // Coverage is the fraction of a column's time span that is recorded, and it varies slowly —
  // sampling it independently per pixel would render as barcode noise rather than density.
  const ctrl = Array.from({length: 40}, () => 0.45 + 0.55*rnd());
  const smooth = (i) => {
    const t = i / W * (ctrl.length - 1), k = Math.floor(t), f = t - k;
    const e = f*f*(3 - 2*f);                       // smoothstep between control points
    return ctrl[k]*(1 - e) + ctrl[Math.min(k+1, ctrl.length-1)]*e;
  };
  for (let i = 0; i < W; i++) {
    const s = state[i];
    if (s === 'none') continue;
    const coverage = s === 'alarm' ? 1 : 0.55 + 0.45*smooth(i);
    g.fillStyle = `rgba(${COL[s]},${coverage.toFixed(3)})`;
    g.fillRect(i, 0, 1, H);
  }
  // Dotted baseline so "no recording" is visibly different from "not loaded".
  g.fillStyle = 'rgba(255,255,255,.16)';
  for (let i = 0; i < W; i += 6) if (state[i] === 'none') g.fillRect(i, H-2, 3, 2);
}
